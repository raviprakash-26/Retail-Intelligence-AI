# A load balancer in front of two application replicas.
#
# This exists so "runs behind more than one process" is something that can be
# started and looked at, rather than a claim in a README. It is deliberately
# small — one upstream, one server block — because the interesting part is not
# the proxy configuration but what the application does when there are two of
# it.

upstream app {
    # Docker's embedded DNS resolves the compose service name to every replica,
    # and nginx round-robins between them. No sticky sessions and no ip_hash:
    # sessions live in Postgres, so any replica can serve any request, and
    # pinning a user to one would only make a rolling deploy more disruptive.
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Large enough for a bank statement CSV, small enough that an upload is not
    # a way to exhaust memory. The application caps it again at 8 MB.
    client_max_body_size 10m;

    # A replica that is draining answers 503 on /api/ready. This is what makes
    # that useful: a request that lands on a replica shutting down is retried
    # against the other one rather than failing in front of somebody.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The application reads this to build absolute URLs and to compare
        # request origin. Getting it wrong behind a proxy is how same-origin
        # checks start rejecting legitimate form posts.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Longer than the slowest thing the product does on a request — a large
        # report export — and shorter than anybody's patience.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Answered by nginx itself, so it reports whether the *balancer* is up.
    # Whether an application replica is up is a different question, asked at
    # /api/ready against each replica directly.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header content-type text/plain;
    }
}
