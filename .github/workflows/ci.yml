name: CI

# The same three gates that run locally before every commit, plus the browser
# suite and a build. Nothing here is a check the repository does not already
# enforce — a pipeline that tests something different from what a developer
# runs is a pipeline that argues with them.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riai
          POSTGRES_PASSWORD: riai
          POSTGRES_DB: riai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U riai -d riai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # The Redis rate limiter is tested against a real server: a mock would
      # only prove the code calls the functions it calls, and the properties
      # worth proving — a shared counter, an expiry, an atomic increment — are
      # all properties of Redis itself.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration suite refuses to run against a database whose name
      # does not end in _test, so this cannot be pointed at anything real by
      # accident.
      DATABASE_URL: postgresql://riai:riai@localhost:5432/riai_test?schema=public
      AUTH_SECRET: test-only-secret-value-at-least-32-characters-long
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # The backup round trip shells out to pg_dump and pg_restore, and a
      # client older than the server refuses to dump at all. The runner ships
      # some version of these; this pins them to the server's major so the
      # round trip is actually exercised rather than skipped.
      - name: Postgres client tools
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit and integration tests
        run: npm run test

  browser:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riai
          POSTGRES_PASSWORD: riai
          POSTGRES_DB: riai_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U riai -d riai_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://riai:riai@localhost:5432/riai_dev?schema=public
      # `next start` boots in production mode, so this job is subject to the
      # production hardening in lib/env.ts — which refused to start the server
      # on a placeholder secret and on unacknowledged in-memory rate limiting.
      # The validator was right and this configuration was wrong: a job that
      # runs a production server has to be configured like one.
      #
      # Not a real secret and not treated as one: it signs sessions for a
      # throwaway database that lives for the length of this job.
      AUTH_SECRET: 7Qx2mVnB4kRt9YpL6wZcHs3JdEaFgU8vNiObTrXyMlPq
      RATE_LIMIT_ALLOW_IN_MEMORY: "true"
      # Same reason as the line above. This job sends no email and does not
      # need to; saying so is what the validator asks for, rather than letting
      # a browser suite boot on a configuration a real deployment could not.
      EMAIL_ALLOW_CONSOLE: "true"
      # http is permitted on localhost; the validator rejects it anywhere else.
      APP_URL: http://localhost:3111
      # The browser suite signs in as the seeded demo tenant and the seeded
      # development administrator, so this job wants both.
      SEED_DEMO_DATA: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx --conditions=react-server prisma/seed.ts

      - name: Build
        run: npm run build

      # Here rather than in the verify job, which is where it looks like it
      # belongs. The scan reads what the build actually emitted, and the verify
      # job never builds — so both of its cases skipped on every run since they
      # were written, and a skip reads as a pass in the report. The scanner
      # written because "the way a secret escapes is duller than an import" had
      # never once run in CI.
      - name: Scan the built client bundle for secrets
        run: npm run test:bundle
        env:
          # Says a build is expected here, so finding none fails rather than
          # skipping. Only this job builds, so only this job may claim it.
          EXPECT_CLIENT_BUNDLE: "1"

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the browser suite
        run: npm run test:e2e

      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. Publishing is a decision about a registry and
      # credentials that belongs to whoever operates this, not to the
      # repository — but a Dockerfile that has never been built is a Dockerfile
      # that does not work.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The backup job is a second image — Postgres client tools plus the AWS
      # CLI — and it is the one nobody would notice was broken until the night
      # it was needed. Same reasoning as above: a Dockerfile that has never
      # been built is a Dockerfile that does not work.
      - name: Build the backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backup.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cheap proof that the tools the backup scripts call are actually in
      # the image. Three separate commands rather than one compound: each
      # failure then names the tool that is missing, and there is no quoting
      # to get wrong.
      - name: Check the backup image carries the tools the scripts need
        run: |
          docker build -f deploy/backup.Dockerfile -t riai-backup:ci .
          docker run --rm riai-backup:ci pg_dump --version
          docker run --rm riai-backup:ci pg_restore --version
          docker run --rm riai-backup:ci aws --version
