name: CI

# The same three gates that run locally before every commit, plus the browser
# suite and a build. Nothing here is a check the repository does not already
# enforce — a pipeline that tests something different from what a developer
# runs is a pipeline that argues with them.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riai
          POSTGRES_PASSWORD: riai
          POSTGRES_DB: riai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U riai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration suite refuses to run against a database whose name
      # does not end in _test, so this cannot be pointed at anything real by
      # accident.
      DATABASE_URL: postgresql://riai:riai@localhost:5432/riai_test?schema=public
      AUTH_SECRET: test-only-secret-value-at-least-32-characters-long
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit and integration tests
        run: npm run test

  browser:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riai
          POSTGRES_PASSWORD: riai
          POSTGRES_DB: riai_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U riai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://riai:riai@localhost:5432/riai_dev?schema=public
      AUTH_SECRET: test-only-secret-value-at-least-32-characters-long
      APP_URL: http://localhost:3111
      # The browser suite signs in as the seeded demo tenant and the seeded
      # development administrator, so this job wants both.
      SEED_DEMO_DATA: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx --conditions=react-server prisma/seed.ts

      - name: Build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the browser suite
        run: npm run test:e2e

      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. Publishing is a decision about a registry and
      # credentials that belongs to whoever operates this, not to the
      # repository — but a Dockerfile that has never been built is a Dockerfile
      # that does not work.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
