# A single-machine deployment: the application, a database, and nothing else.
#
# This is the honest shape of a small self-hosted install — one shop's
# accountant running it on one box, or somebody trying the whole thing before
# deciding. It is not a production topology for many tenants: there is one
# instance, no backup schedule, and the database volume lives on the same host.
# The README says what that means and what to do instead.
#
#   cp .env.example .env      # then fill in AUTH_SECRET, APP_URL and
#                             # POSTGRES_PASSWORD, and answer EMAIL_ALLOW_CONSOLE
#   docker compose up -d --build
#   docker compose run --rm app npx prisma migrate deploy
#   docker compose run --rm app npx tsx prisma/seed.ts   # platform data

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-riai}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-riai}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The application will not start usefully before this answers, and
      # `depends_on` alone only waits for the container, not for the server.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riai}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published. The application reaches it over the compose network; a
    # database on a public port is how a self-hosted install becomes somebody
    # else's.
    expose:
      - "5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Everything the application reads, and nothing it does not.
    #
    # A container only receives what is named here — `.env` is read to fill in
    # the `${...}` below, and is otherwise not passed to it. This block used to
    # name seven variables, so an install that filled in `.env` as the line at
    # the top of this file says got a container that ignored almost all of it:
    # payment keys configured and payments disabled, a tuned drain window back
    # at its default, a chosen log level with no effect. The `backup` service
    # below always did this properly; this one did not.
    environment:
      # Owned by this file rather than by whoever deploys it. Where the
      # database lives is a fact about this topology, and a production
      # container that could be told it was in development is a foot-gun.
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-riai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-riai}?schema=public"
      # Nothing is seeded into a production database by default: the demo
      # tenant and the development administrator both refuse to run here.
      SEED_DEMO_DATA: "false"

      APP_URL: "${APP_URL:?set APP_URL in .env}"
      AUTH_SECRET: "${AUTH_SECRET:?generate one with openssl rand -base64 48}"
      SESSION_MAX_AGE_SECONDS: "${SESSION_MAX_AGE_SECONDS:-43200}"
      PASSWORD_HASH_ROUNDS: "${PASSWORD_HASH_ROUNDS:-12}"

      # Redis is in this file, so the limiter shares one counter and this
      # deployment can be scaled to more than one container without the limits
      # quietly becoming per-replica. Set RATE_LIMIT_DRIVER=memory and
      # RATE_LIMIT_ALLOW_IN_MEMORY=true in .env if you would rather run without
      # it — the environment validator will hold you to saying so out loud, and
      # now that both are forwarded, saying it actually reaches the container.
      RATE_LIMIT_DRIVER: "${RATE_LIMIT_DRIVER:-redis}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      RATE_LIMIT_ALLOW_IN_MEMORY: "${RATE_LIMIT_ALLOW_IN_MEMORY:-false}"

      # No mailer is written yet — see "What this is not ready for" in the
      # README — so a self-hosted install sends nothing, and the validator
      # refuses to start rather than let that be true silently. Answer it in
      # .env: EMAIL_ALLOW_CONSOLE=true to accept that no email leaves this
      # deployment, or point EMAIL_DRIVER at a driver once one exists.
      EMAIL_DRIVER: "${EMAIL_DRIVER:-console}"
      EMAIL_ALLOW_CONSOLE: "${EMAIL_ALLOW_CONSOLE:-false}"
      EMAIL_FROM: "${EMAIL_FROM:-Retail Intelligence AI <no-reply@example.com>}"
      SMTP_URL: "${SMTP_URL:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"

      # All three Razorpay values or none: the key pair opens a checkout and
      # the webhook secret is what lets a payment be confirmed, so a container
      # given two of the three would take money and never move a plan.
      PAYMENTS_DRIVER: "${PAYMENTS_DRIVER:-disabled}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"

      AI_DRIVER: "${AI_DRIVER:-disabled}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-claude-sonnet-5}"
      AI_MAX_OUTPUT_TOKENS: "${AI_MAX_OUTPUT_TOKENS:-2048}"

      # The drain window has to exceed whatever health-check interval sits in
      # front of this, and the stop grace period below has to exceed the drain.
      SHUTDOWN_DRAIN_MS: "${SHUTDOWN_DRAIN_MS:-10000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      INSTANCE_ID: "${INSTANCE_ID:-}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
    # Longer than SHUTDOWN_DRAIN_MS, or the drain is cut short by the thing it
    # exists to survive. Compose allows ten seconds by default and the drain
    # window is ten seconds by default, so without this the SIGKILL lands on
    # the same tick as the graceful exit — which did not matter while the
    # process was exiting in twelve milliseconds and matters now that it is
    # not. The replica overlay says the same thing for the same reason.
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-3000}:3000"

  # Shared rate-limit counters, so two application containers enforce one
  # budget rather than one each.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # A nightly dump, kept locally and — if a bucket is configured — sent off the
  # machine as well.
  #
  # Without BACKUP_S3_BUCKET this is still the floor: the dump lives on the same
  # disk as the database it came from, so it survives a dropped table and not a
  # dead machine, and the script says so on every run. With one set, the same
  # dump is uploaded and the uploaded object is read back to confirm its size
  # before anything is pruned.
  #
  # Any S3-compatible store works — S3, Cloudflare R2, Supabase, MinIO — since
  # the only thing that differs is the endpoint. Credentials come from the
  # standard AWS variables so nothing here has to reimplement how the CLI is
  # configured.
  #
  # Even with this, managed Postgres with point-in-time recovery is the better
  # answer for books somebody will need in a tax dispute three years from now.
  # A nightly dump loses up to a day.
  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-riai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-riai}"
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      # Unset by default. Setting the bucket is what turns on the off-machine
      # copy; everything else has a working default.
      BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:-}"
      BACKUP_S3_PREFIX: "${BACKUP_S3_PREFIX:-riai}"
      BACKUP_S3_ENDPOINT: "${BACKUP_S3_ENDPOINT:-}"
      BACKUP_S3_STORAGE_CLASS: "${BACKUP_S3_STORAGE_CLASS:-}"
      BACKUP_S3_SSE: "${BACKUP_S3_SSE:-}"
      AWS_ACCESS_KEY_ID: "${BACKUP_S3_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${BACKUP_S3_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${BACKUP_S3_REGION:-auto}"
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        while true; do
          /scripts/backup.sh || echo "backup: run failed" >&2
          sleep 86400
        done

volumes:
  postgres-data:
  backups:
